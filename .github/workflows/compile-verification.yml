# Generated sample verification for Octri SDK Studio.
name: Compile Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift toolchain
        run: swift --version
      - name: Compile SDK
        run: swift build --jobs 4
